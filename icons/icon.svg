<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9D174D" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#FBCFE8" stroke-width="8" />
  
  <!-- Subtle Internal Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8" />
  
  <g filter="url(#softGlow)" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Elegant Minimal Shopping Basket -->
    <path d="M140 220 H372 L346 380 H166 Z" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Basket Arch / Handle -->
    <path d="M190 220 C190 140 322 140 322 220" stroke-width="22" />
    
    <!-- Delicate Center Crest Monogram Knot -->
    <circle cx="256" cy="300" r="28" fill="#9D174D" stroke="#FFFFFF" stroke-width="6" />
    <path d="M256 286 L256 314 M242 300 L270 300" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
