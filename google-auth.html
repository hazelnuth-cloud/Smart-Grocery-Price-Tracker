<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk dengan Google • Smart Grocery Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFFFF;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto 0;
      border: 1px solid #DADCE0;
      border-radius: 8px;
      padding: 36px 36px 28px;
      background: #FFFFFF;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
    }

    @media (max-width: 480px) {
      .auth-wrapper {
        border: none;
        box-shadow: none;
        padding: 16px 8px;
      }
    }

    .google-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .google-logo {
      display: inline-block;
      margin-bottom: 12px;
    }

    .google-title {
      font-size: 1.45rem;
      font-weight: 500;
      color: #202124;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .google-subtitle {
      font-size: 0.95rem;
      color: #5F6368;
      line-height: 1.4;
    }

    .google-subtitle strong {
      color: #202124;
      font-weight: 500;
    }

    /* Accounts List */
    .accounts-list {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
      border-top: 1px solid #ECEFF1;
    }

    .account-item {
      display: flex;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid #ECEFF1;
      cursor: pointer;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .account-item:hover {
      background-color: #F8F9FA;
    }

    .account-item:active {
      background-color: #F1F3F4;
    }

    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #1A73E8;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      margin-right: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .account-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-details {
      flex: 1;
      min-width: 0;
    }

    .account-name {
      font-size: 0.92rem;
      font-weight: 500;
      color: #202124;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .account-email {
      font-size: 0.8rem;
      color: #5F6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-remove-btn {
      background: none;
      border: none;
      color: #70757A;
      font-size: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s;
    }

    .account-remove-btn:hover {
      background-color: #E8EAED;
      color: #D93025;
    }

    /* Action Buttons */
    .btn-use-another {
      display: flex;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid #ECEFF1;
      cursor: pointer;
      color: #1A73E8;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 0.15s;
      background: none;
      width: 100%;
      text-align: left;
      border-left: none;
      border-right: none;
    }

    .btn-use-another:hover {
      background-color: #F8F9FA;
    }

    .btn-use-another-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px dashed #DADCE0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 1.2rem;
      color: #1A73E8;
      flex-shrink: 0;
    }

    /* Form Section */
    .new-account-form {
      display: none;
      margin-top: 10px;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      color: #5F6368;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 10px 14px;
      border: 1px solid #DADCE0;
      border-radius: 4px;
      font-size: 0.95rem;
      color: #202124;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #1A73E8;
      box-shadow: 0 0 0 1px #1A73E8;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .btn-text {
      background: none;
      border: none;
      color: #1A73E8;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.15s;
    }

    .btn-text:hover {
      background-color: #F1F3F4;
    }

    .btn-primary {
      background-color: #1A73E8;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      height: 40px;
      padding: 0 24px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      background-color: #1765CC;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3);
    }

    .btn-primary:active {
      background-color: #1558B0;
    }

    .form-hint {
      font-size: 0.78rem;
      color: #D93025;
      margin-top: 4px;
      display: none;
    }

    .privacy-notice {
      font-size: 0.75rem;
      color: #5F6368;
      line-height: 1.5;
      margin-top: 20px;
    }

    /* Footer */
    .google-footer {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      font-size: 0.74rem;
      color: #5F6368;
    }

    .google-footer-links a {
      color: #5F6368;
      text-decoration: none;
      margin-left: 14px;
    }

    .google-footer-links a:hover {
      color: #202124;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="google-header">
      <div class="google-logo">
        <svg width="40" height="40" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
      </div>
      <h1 class="google-title" id="pageTitle">Pilih akun</h1>
      <p class="google-subtitle">untuk melanjutkan ke <strong>Smart Grocery Tracker</strong></p>
    </div>

    <!-- Accounts List Container -->
    <div id="accountsContainer">
      <div id="accountsList" class="accounts-list">
        <!-- Rendered dynamically -->
      </div>

      <button type="button" class="btn-use-another" id="btnUseAnother" onclick="showNewAccountForm()">
        <div class="btn-use-another-icon">➕</div>
        <div>Gunakan akun Google lain</div>
      </button>
    </div>

    <!-- New Account Form Section -->
    <div id="newAccountSection" class="new-account-form">
      <div class="form-group">
        <label class="form-label" for="inputEmail">Email Google (@gmail.com)</label>
        <input type="email" id="inputEmail" class="form-input" placeholder="nama@gmail.com" autofocus autocomplete="email">
        <div id="emailHint" class="form-hint">Harap masukkan alamat email Google yang valid!</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="inputName">Nama Akun (Opsional)</label>
        <input type="text" id="inputName" class="form-input" placeholder="Nama Anda" autocomplete="name">
      </div>

      <div class="form-actions">
        <button type="button" class="btn-text" id="btnBack" onclick="hideNewAccountForm()">Kembali</button>
        <button type="button" class="btn-primary" onclick="submitGoogleAccount()">Berikutnya</button>
      </div>
    </div>

    <p class="privacy-notice">
      Untuk melanjutkan, Google akan membagikan nama, alamat email, dan preferensi bahasa Anda dengan Smart Grocery Tracker &amp; Budget Planner.
    </p>
  </div>

  <footer class="google-footer">
    <div>Bahasa Indonesia</div>
    <div class="google-footer-links">
      <a href="#" onclick="return false;">Bantuan</a>
      <a href="#" onclick="return false;">Privasi</a>
      <a href="#" onclick="return false;">Persyaratan</a>
    </div>
  </footer>

  <script>
    const STORAGE_KEY_GOOGLE = 'smart_grocery_google_accounts';
    const STORAGE_KEY_USER = 'smart_grocery_user';
    const STORAGE_KEY_REG = 'smart_grocery_registered_users';

    // Purge any lingering Audrey references immediately
    function cleanLegacyAudrey() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY_GOOGLE);
        if (raw) {
          let list = JSON.parse(raw);
          if (Array.isArray(list)) {
            list = list.filter(a => a && a.email && !a.email.toLowerCase().includes('audrey') && (!a.name || !a.name.toLowerCase().includes('audrey')));
            localStorage.setItem(STORAGE_KEY_GOOGLE, JSON.stringify(list));
          }
        }
      } catch (e) {}
    }
    cleanLegacyAudrey();

    function getAccounts() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_GOOGLE);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(a => a && a.email && !a.email.toLowerCase().includes('audrey'));
      } catch (e) {
        return [];
      }
    }

    function saveAccounts(list) {
      try {
        localStorage.setItem(STORAGE_KEY_GOOGLE, JSON.stringify(list || []));
      } catch (e) {
        console.warn('Error saving accounts:', e);
      }
    }

    function renderAccounts() {
      const listEl = document.getElementById('accountsList');
      const accounts = getAccounts();

      if (accounts.length === 0) {
        // Automatically show input form if no accounts exist yet
        showNewAccountForm(false);
        return;
      }

      listEl.innerHTML = accounts.map(acc => {
        const initial = (acc.name || acc.email || 'G').charAt(0).toUpperCase();
        const avatarHtml = acc.photoURL 
          ? `<img src="${escapeHtml(acc.photoURL)}" alt="Avatar">`
          : initial;

        return `
          <div class="account-item" onclick="chooseAccount('${escapeHtml(acc.email)}')">
            <div class="account-avatar">${avatarHtml}</div>
            <div class="account-details">
              <div class="account-name">${escapeHtml(acc.name || acc.email)}</div>
              <div class="account-email">${escapeHtml(acc.email)}</div>
            </div>
            <button type="button" class="account-remove-btn" title="Hapus akun dari perangkat ini" onclick="removeAccount('${escapeHtml(acc.email)}', event)">✕</button>
          </div>
        `;
      }).join('');

      document.getElementById('accountsContainer').style.display = 'block';
      document.getElementById('newAccountSection').style.display = 'none';
      document.getElementById('pageTitle').textContent = 'Pilih akun';
    }

    function showNewAccountForm(allowBack = true) {
      document.getElementById('accountsContainer').style.display = 'none';
      document.getElementById('newAccountSection').style.display = 'block';
      document.getElementById('pageTitle').textContent = 'Masuk dengan Google';
      document.getElementById('btnBack').style.display = allowBack ? 'inline-block' : 'none';
      document.getElementById('inputEmail').focus();
    }

    function hideNewAccountForm() {
      const accounts = getAccounts();
      if (accounts.length > 0) {
        document.getElementById('accountsContainer').style.display = 'block';
        document.getElementById('newAccountSection').style.display = 'none';
        document.getElementById('pageTitle').textContent = 'Pilih akun';
        document.getElementById('emailHint').style.display = 'none';
      }
    }

    function removeAccount(email, evt) {
      if (evt) evt.stopPropagation();
      let accounts = getAccounts();
      accounts = accounts.filter(a => a.email.toLowerCase() !== email.toLowerCase());
      saveAccounts(accounts);
      renderAccounts();
    }

    function chooseAccount(email) {
      const accounts = getAccounts();
      const acc = accounts.find(a => a.email.toLowerCase() === email.toLowerCase());
      if (!acc) return;

      const userObj = {
        name: acc.name,
        email: acc.email,
        photoURL: acc.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(acc.name)}&background=4285F4&color=fff&bold=true`,
        uid: 'google_' + acc.email.toLowerCase().replace(/[^a-z0-9]/g, '_'),
        authProvider: 'google',
        isLiveFirebaseSession: false,
        loggedAt: new Date().toISOString()
      };

      finishAuthentication(userObj);
    }

    function submitGoogleAccount() {
      const emailInput = document.getElementById('inputEmail');
      const nameInput = document.getElementById('inputName');
      const hint = document.getElementById('emailHint');

      let email = emailInput.value.trim().toLowerCase();
      let name = nameInput.value.trim();

      if (!email) {
        hint.textContent = 'Masukkan alamat email Google Anda';
        hint.style.display = 'block';
        emailInput.focus();
        return;
      }

      if (!email.includes('@')) {
        email += '@gmail.com';
      }

      if (!name) {
        const rawName = email.split('@')[0];
        name = rawName.charAt(0).toUpperCase() + rawName.slice(1);
      }

      // Check not demo/audrey
      if (name.toLowerCase().includes('audrey') || email.includes('audrey')) {
        name = 'Pengguna Google';
        email = 'user@gmail.com';
      }

      const photoURL = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4285F4&color=fff&bold=true`;
      const uid = 'google_' + email.replace(/[^a-z0-9]/g, '_');

      // Save to Google accounts on this device
      let accounts = getAccounts();
      const existingIdx = accounts.findIndex(a => a.email.toLowerCase() === email);
      const accObj = { name, email, photoURL, lastLogin: new Date().toISOString() };
      if (existingIdx >= 0) {
        accounts[existingIdx] = accObj;
      } else {
        accounts.push(accObj);
      }
      saveAccounts(accounts);

      const userObj = {
        name,
        email,
        photoURL,
        uid,
        authProvider: 'google',
        isLiveFirebaseSession: false,
        loggedAt: new Date().toISOString()
      };

      finishAuthentication(userObj);
    }

    function finishAuthentication(userObj) {
      // 1. Post message to opener window if running as popup
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_SUCCESS',
            user: userObj
          }, '*');
          window.close();
          return;
        } catch (e) {
          console.warn('postMessage to opener notice:', e);
        }
      }

      // 2. Fallback if opened in full tab / iframe
      localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(userObj));
      window.location.href = 'index.html';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard support: Enter key submits
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const section = document.getElementById('newAccountSection');
        if (section && section.style.display !== 'none') {
          submitGoogleAccount();
        }
      }
    });

    renderAccounts();
  </script>
</body>
</html>
